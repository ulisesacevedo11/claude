<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 620" width="880" height="620" font-family="system-ui,Segoe UI,Helvetica,Arial,sans-serif">
<rect x="0" y="0" width="880" height="620" fill="#ffffff"/>
<text x="440" y="34" text-anchor="middle" font-size="19" font-weight="700" fill="#111a21">Diagrama circular (Heyland–Ossanna) — motor asincrónico trifásico</text>

<!-- zona de arranque sombreada -->
<path d="M 471 159 A 242 242 0 0 1 589 202" stroke="#a9541c" stroke-width="11" fill="none" opacity="0.22" stroke-linecap="round"/>

<!-- circulo -->
<circle cx="450" cy="400" r="242" stroke="#0d5c8a" stroke-width="2.4" fill="none"/>

<!-- ejes -->
<line x1="60" y1="470" x2="800" y2="470" stroke="#111a21" stroke-width="1.6"/>
<polygon points="800,470 790,466 790,474" fill="#111a21"/>
<text x="800" y="490" font-size="12" fill="#64748b">eje de abscisas (reactiva)</text>
<line x1="120" y1="505" x2="120" y2="70" stroke="#111a21" stroke-width="1.6"/>
<polygon points="120,70 116,80 124,80" fill="#111a21"/>
<text x="128" y="80" font-size="14" font-weight="700" fill="#111a21">V₁</text>
<text x="128" y="96" font-size="11.5" fill="#64748b">(eje de potencia activa)</text>

<!-- recta del par  P0-Pinf -->
<line x1="165" y1="435" x2="790" y2="359" stroke="#0d5c8a" stroke-width="1.8" stroke-dasharray="9 5"/>
<text x="700" y="352" font-size="12.5" font-weight="600" fill="#0d5c8a">recta del par  (P_c = 0)</text>

<!-- recta de la potencia mecanica P0-Pcc -->
<line x1="168" y1="462" x2="620" y2="116" stroke="#0f7a52" stroke-width="1.8" stroke-dasharray="9 5"/>
<text x="600" y="106" font-size="12.5" font-weight="600" fill="#0f7a52" text-anchor="end">recta de la potencia mecánica  (P_m = 0)</text>

<!-- vertical en Pcc -->
<line x1="541" y1="176" x2="541" y2="470" stroke="#64748b" stroke-width="1.2" stroke-dasharray="3 4"/>
<line x1="541" y1="176" x2="541" y2="390" stroke="#a9541c" stroke-width="4"/>
<text x="552" y="290" font-size="12.5" font-weight="600" fill="#a9541c">par de arranque</text>
<text x="552" y="306" font-size="11.5" fill="#a9541c">( = P_Cu2 , pues P_m = 0 )</text>
<circle cx="541" cy="390" r="3" fill="#64748b"/>
<line x1="541" y1="390" x2="541" y2="470" stroke="#64748b" stroke-width="3.2"/>
<text x="552" y="436" font-size="11.5" fill="#64748b">P_Fe + P_Cu1</text>

<!-- vertical en Pn -->
<line x1="213" y1="350" x2="213" y2="470" stroke="#64748b" stroke-width="1.2" stroke-dasharray="3 4"/>
<line x1="213" y1="350" x2="213" y2="428" stroke="#0f7a52" stroke-width="4"/>
<text x="150" y="330" font-size="12.5" font-weight="600" fill="#0f7a52">P_m nominal</text>

<!-- fasores -->
<line x1="120" y1="470" x2="210" y2="430" stroke="#64748b" stroke-width="2.2"/>
<circle cx="210" cy="430" r="5" fill="#64748b"/>
<text x="196" y="452" font-size="12.5" font-weight="700" fill="#64748b">I₀</text>

<line x1="120" y1="470" x2="213" y2="350" stroke="#0f7a52" stroke-width="2.8"/>
<circle cx="213" cy="350" r="6" fill="#0f7a52"/>
<text x="100" y="352" font-size="13" font-weight="700" fill="#0f7a52">I_n</text>

<line x1="120" y1="470" x2="541" y2="176" stroke="#a9541c" stroke-width="3.2"/>
<circle cx="541" cy="176" r="6.5" fill="#a9541c"/>
<text x="318" y="300" font-size="14" font-weight="700" fill="#a9541c">I_arr</text>

<!-- angulos -->
<path d="M 120 410 A 60 60 0 0 1 156.8 422.6" stroke="#0f7a52" stroke-width="1.5" fill="none"/>
<text x="130" y="438" font-size="12" fill="#0f7a52">φ_n</text>
<path d="M 120 365 A 105 105 0 0 1 206 410" stroke="#a9541c" stroke-width="1.5" fill="none"/>
<text x="150" y="388" font-size="12" fill="#a9541c">φ_arr</text>

<!-- puntos notables -->
<circle cx="690" cy="372" r="5" fill="#0d5c8a"/>
<text x="700" y="392" font-size="12.5" font-weight="700" fill="#0d5c8a">P∞  (s → ∞)</text>
<text x="150" y="424" font-size="12.5" font-weight="700" fill="#64748b">P₀ (s = 0)</text>
<text x="556" y="166" font-size="13" font-weight="700" fill="#a9541c">P_cc  (s = 1)</text>
<text x="556" y="150" font-size="11.5" fill="#a9541c">rotor bloqueado</text>
<text x="228" y="344" font-size="13" font-weight="700" fill="#0f7a52">P_n (s = s_n)</text>
<circle cx="421" cy="160" r="4.5" fill="#0d5c8a"/>
<text x="412" y="150" font-size="12" font-weight="600" fill="#0d5c8a" text-anchor="end">M_máx</text>

<!-- flecha de aceleracion sobre el arco -->
<path d="M 520 190 A 242 242 0 0 0 232 360" stroke="#a9541c" stroke-width="2" fill="none" stroke-dasharray="6 5" marker-end="url(#fl)"/>
<defs><marker id="fl" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><polygon points="0,0 9,4.5 0,9" fill="#a9541c"/></marker></defs>
<text x="360" y="222" font-size="11.5" fill="#a9541c" text-anchor="middle">el motor recorre el arco al acelerar</text>

<!-- zona de arranque etiqueta -->
<text x="646" y="196" font-size="12.5" font-weight="700" fill="#a9541c">ZONA DE ARRANQUE</text>
<text x="646" y="212" font-size="11.5" fill="#a9541c">s ≈ 1 · I máxima · cos φ bajo</text>

<text x="120" y="556" font-size="11.5" fill="#64748b">Diámetro P₀P∞ = V₁ / X_cc    ·    la ordenada de cada punto mide P₁    ·    escalas: corriente (A/mm), potencia (W/mm), par (N·m/mm)</text>
<text x="120" y="574" font-size="11.5" fill="#64748b">El lugar geométrico del extremo de I₁ al variar s es una circunferencia: por eso un solo dibujo resuelve toda la máquina.</text>

<!-- punto generico P: I1 -->
<line x1="120" y1="470" x2="279" y2="229" stroke="#0d5c8a" stroke-width="2.8"/>
<circle cx="279" cy="229" r="6" fill="#0d5c8a"/>
<text x="286" y="220" font-size="12.5" font-weight="700" fill="#0d5c8a">P  (un s cualquiera)</text>
<text x="196" y="266" font-size="15" font-weight="700" fill="#0d5c8a">I₁</text>
<text x="120" y="592" font-size="11.5" fill="#0d5c8a">Todo radio vector O–P es I₁ : I₀ , I_n e I_arr son esa misma corriente evaluada en s = 0 , s = s_n y s = 1.</text>
</svg>
