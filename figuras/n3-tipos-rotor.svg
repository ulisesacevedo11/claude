616" y="259" font-size="10" fill="#64748b" text-anchor="start">· corre s_Ck hacia s = 1</text><text x="616" y="278" font-size="10" fill="#64748b" text-anchor="start">· M_máx no cambia de valor</text><text x="616" y="297" font-size="10" fill="#64748b" text-anchor="start">· par máximo en el arranque</text><text x="616" y="316" font-size="10" fill="#64748b" text-anchor="start">· escobillas: mantenimiento</text><text x="26" y="372" font-size="11.5" fill="#64748b" text-anchor="start">En la jaula R₂ la fija el fabricante y el efecto pelicular la hace variar sola con la frecuencia f₂ = s·f₁; en el rotor bobinado la elige el usuario.</text></svg>