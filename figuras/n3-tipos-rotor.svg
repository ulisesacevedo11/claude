t-weight="700">Ranura profunda</text><text x="306" y="85" font-size="10" fill="#64748b" text-anchor="middle">barra alta y angosta</text><line x1="240" y1="100" x2="372" y2="100" stroke="#0d5c8a" stroke-width="2.2"/><text x="306" y="96" font-size="9" fill="#0d5c8a" text-anchor="middle">entrehierro</text><rect x="240" y="104" width="132" height="110" fill="#e9eef2" stroke="#64748b" stroke-width="1.2"/><rect x="295" y="112" width="22" height="94" rx="7" fill="#a9541c" opacity="0.85"/><rect x="295" y="112" width="22" height="28" rx="7" fill="#d98b50"/><line x1="350" y1="126" x2="321" y2="126" stroke="#a9541c" stroke-width="1.8" marker-end="url(#a)"/><text x="348" y="146" font-size="8.5" fill="#a9541c" text-anchor="middle" font-weight="700">I en el</text><text x="348" y="158" font-size="8.5" fill="#a9541c" text-anchor="middle" font-weight="700">arranque</text><text x="234" y="240" font-size="10" fill="#64748b" text-anchor="start">· efecto pelicular fuerte</text><text x="234" y="259" font-size="10" fill="#64748b" text-anchor="start">· R₂ alta en el arranque</text><text x="234" y="278" font-size="10" fill="#64748b" text-anchor="start">· M_arr 1,2–1,5 Mₙ</text><text x="234" y="297" font-size="10" fill="#64748b" text-anchor="start">· I_arr 4–4,8 Iₙ</text><rect x="410" y="48" width="176" height="300" rx="9" fill="#fbfcfd" stroke="#64748b" stroke-width="1.3"/><text x="498" y="70" font-size="12.5" fill="#111a21" text-anchor="middle" font-weight="700">Doble jaula</text><text x="498" y="85" font-size="10" fill="#64748b" text-anchor="middle">externa + interna</text><line x1="432" y1="100" x2="564" y2="100" stroke="#0d5c8a" stroke-width="2.2"/><text x="498" y="96" font-size="9" fill="#0d5c8a" text-anchor="middle">entrehierro</text><rect x="432" y="104" width="132" height="110" fill="#e9eef2" stroke="#64748b" stroke-width="1.2"/><rect x="485" y="112" width="26" height="24" rx="6" fill="#d98b50"/><rect x="477" y="148" width="42" height="56" rx="9" fill="#a9541c" opacity="0.85"/><line