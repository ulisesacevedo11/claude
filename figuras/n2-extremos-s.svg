<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 352" width="800" height="352" font-family="system-ui,Segoe UI,Helvetica,Arial,sans-serif"><rect width="800" height="352" fill="#ffffff"/><defs><marker id="a" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="9" refX="10" refY="4.5" orient="auto"><polygon points="0,0 11,4.5 0,9" fill="#a9541c"/></marker><marker id="ac" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="9" refX="10" refY="4.5" orient="auto"><polygon points="0,0 11,4.5 0,9" fill="#0d5c8a"/></marker></defs><text x="400" y="26" font-size="15" fill="#111a21" text-anchor="middle" font-weight="700">Los dos extremos del resbalamiento en la rama rotórica</text><rect x="25" y="60" width="350" height="240" rx="10" fill="#fbfcfd" stroke="#64748b" stroke-width="1.4"/><text x="200" y="86" font-size="13" fill="#a9541c" text-anchor="middle" font-weight="700">s = 1 · rotor bloqueado</text><line x1="47" y1="150" x2="85" y2="150" stroke="#111a21" stroke-width="2"/><path d="M85 150 L90 141 L100 159 L110 141 L120 159 L130 141 L140 159 L145 150" stroke="#111a21" stroke-width="2.4" fill="none"/><text x="115" y="134" font-size="11.5" fill="#111a21" text-anchor="middle" font-weight="700">R′₂</text><line x1="145" y1="150" x2="165" y2="150" stroke="#111a21" stroke-width="2"/><path d="M165 150 A 7.5 7.5 0 0 1 180 150 A 7.5 7.5 0 0 1 195 150 A 7.5 7.5 0 0 1 210 150 A 7.5 7.5 0 0 1 225 150" stroke="#111a21" stroke-width="2.4" fill="none"/><text x="195" y="136" font-size="11.5" fill="#111a21" text-anchor="middle" font-weight="700">X′₂</text><line x1="225" y1="150" x2="253" y2="150" stroke="#111a21" stroke-width="2"/><line x1="253" y1="150" x2="325" y2="150" stroke="#a9541c" stroke-width="4.5"/><text x="289" y="134" font-size="11" fill="#a9541c" text-anchor="middle" font-weight="700">EN CORTO</text><text x="289" y="176" font-size="10.5" fill="#64748b" text-anchor="middle">R′₂(1−s)/s = 0</text><line x1="325" y1="150" x2="347" y2="150" stroke="#111a21" stroke-width="2"/><line x1="347" y1="150" x2="347" y2="202" stroke="#111a21" stroke-width="2"/><line x1="347" y1="202" x2="47" y2="202" stroke="#111a21" stroke-width="2"/><line x1="47" y1="202" x2="47" y2="150" stroke="#111a21" stroke-width="2"/><text x="31" y="180" font-size="12" fill="#111a21" text-anchor="middle" font-weight="700">E′₂</text><text x="200" y="236" font-size="10.5" fill="#64748b" text-anchor="middle">f₂ = f₁ = 50 Hz  ·  E₂ máxima</text><text x="200" y="252" font-size="10.5" fill="#64748b" text-anchor="middle">I₂ máxima (4 a 7 Iₙ)  ·  cos φ₂ ≈ 0,2</text><text x="200" y="268" font-size="10.5" fill="#64748b" text-anchor="middle">Pₘ = 0  ·  todo se va en P_Cu2</text><text x="200" y="284" font-size="10.5" fill="#a9541c" text-anchor="middle" font-weight="700">→ TRANSFORMADOR EN CORTOCIRCUITO</text><rect x="415" y="60" width="350" height="240" rx="10" fill="#fbfcfd" stroke="#64748b" stroke-width="1.4"/><text x="590" y="86" font-size="13" fill="#0d5c8a" text-anchor="middle" font-weight="700">s = 0 · sincronismo</text><line x1="437" y1="150" x2="475" y2="150" stroke="#111a21" stroke-width="2"/><path d="M475 150 L480 141 L490 159 L500 141 L510 159 L520 141 L530 159 L535 150" stroke="#111a21" stroke-width="2.4" fill="none"/><text x="505" y="134" font-size="11.5" fill="#111a21" text-anchor="middle" font-weight="700">R′₂</text><line x1="535" y1="150" x2="555" y2="150" stroke="#111a21" stroke-width="2"/><path d="M555 150 A 7.5 7.5 0 0 1 570 150 A 7.5 7.5 0 0 1 585 150 A 7.5 7.5 0 0 1 600 150 A 7.5 7.5 0 0 1 615 150" stroke="#111a21" stroke-width="2.4" fill="none"/><text x="585" y="136" font-size="11.5" fill="#111a21" text-anchor="middle" font-weight="700">X′₂</text><line x1="615" y1="150" x2="643" y2="150" stroke="#111a21" stroke-width="2"/><circle cx="647" cy="150" r="4.5" fill="none" stroke="#0d5c8a" stroke-width="2.4"/><circle cx="711" cy="150" r="4.5" fill="none" stroke="#0d5c8a" stroke-width="2.4"/><text x="679" y="134" font-size="11" fill="#0d5c8a" text-anchor="middle" font-weight="700">ABIERTO</text><text x="679" y="176" font-size="10.5" fill="#64748b" text-anchor="middle">R′₂(1−s)/s → ∞</text><line x1="715" y1="150" x2="737" y2="150" stroke="#111a21" stroke-width="2"/><line x1="737" y1="150" x2="737" y2="202" stroke="#111a21" stroke-width="2"/><line x1="737" y1="202" x2="437" y2="202" stroke="#111a21" stroke-width="2"/><line x1="437" y1="202" x2="437" y2="150" stroke="#111a21" stroke-width="2"/><text x="421" y="180" font-size="12" fill="#111a21" text-anchor="middle" font-weight="700">E′₂</text><text x="590" y="236" font-size="10.5" fill="#64748b" text-anchor="middle">f₂ = 0  ·  E₂ = 0</text><text x="590" y="252" font-size="10.5" fill="#64748b" text-anchor="middle">I′₂ = 0  ·  sólo circula I₀</text><text x="590" y="268" font-size="10.5" fill="#64748b" text-anchor="middle">par nulo  ·  Pₘ = 0</text><text x="590" y="284" font-size="10.5" fill="#0d5c8a" text-anchor="middle" font-weight="700">→ TRANSFORMADOR EN VACÍO</text><text x="40" y="332" font-size="11.5" fill="#64748b" text-anchor="start">R′₂ no depende de s; E₂ y X₂ sí. De esa asimetría sale todo el comportamiento de la máquina.</text></svg>